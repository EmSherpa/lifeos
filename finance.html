<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoinQuest">
<title>CoinQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">

<style>
  :root {
    --green: #39ff14;
    --green-dim: rgba(57,255,20,0.12);
    --red: #ff4757;
    --red-dim: rgba(255,71,87,0.12);
    --gold: #d4a853;
    --gold-dim: rgba(212,168,83,0.12);
    --bg: #06060a;
    --surface: rgba(255,255,255,0.035);
    --surface2: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.1);
    --text: #e8e6e1;
    --muted: #768390;
    --pixel: 'VT323', monospace;
    --mono: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    overflow: hidden;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    animation: appFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes appFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .nav-back {
    padding: 16px 16px 0;
    color: var(--muted);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 700;
    display: inline-block;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.2s;
  }
  .nav-back:hover { color: var(--green); }

  .screen {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px 100px;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: block; }

  /* ── Bottom Nav ── */
  #bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: rgba(6, 6, 10, 0.96);
    border-top: 1px solid var(--border);
    display: flex;
    backdrop-filter: blur(12px);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px;
    gap: 5px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: color 0.2s;
    font-family: var(--pixel);
    font-size: 1.1rem;
    letter-spacing: 0.5px;
  }
  .nav-btn .icon { font-size: 22px; }
  .nav-btn.active { color: var(--green); }
  .nav-btn.active .icon { filter: drop-shadow(0 0 6px var(--green)); }

  /* ── ADD button center ── */
  .nav-btn.add-btn { position: relative; top: -18px; }
  .nav-btn.add-btn .icon-wrap {
    width: 52px; height: 52px;
    background: var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 20px rgba(57,255,20,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    color: #06060a;
  }
  .nav-btn.add-btn:active .icon-wrap { transform: scale(0.93); box-shadow: 0 0 10px rgba(57,255,20,0.3); }

  /* ── Typography ── */
  .pixel { font-family: var(--pixel); }
  .mono  { font-family: var(--mono); }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-accent-green { border-color: rgba(57,255,20,0.3); }
  .card-accent-red   { border-color: rgba(255,71,87,0.3); }

  /* ── Header strip ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .page-title {
    font-family: var(--pixel);
    font-size: 1.6rem;
    color: var(--green);
    letter-spacing: 1px;
  }

  /* ── Streak badge ── */
  .streak-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-dim);
    border: 1px solid rgba(212,168,83,0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: var(--pixel);
    font-size: 1.1rem;
    color: var(--gold);
  }

  /* ── Balance hero ── */
  .balance-hero { text-align: center; padding: 20px 0 14px; }
  .balance-label {
    font-family: var(--pixel);
    font-size: 1.1rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .balance-amount {
    font-family: var(--pixel);
    font-size: 3rem;
    color: var(--green);
    text-shadow: 0 0 20px rgba(57,255,20,0.4);
    letter-spacing: 1px;
  }
  .balance-amount.negative { color: var(--red); text-shadow: 0 0 20px rgba(255,71,87,0.4); }

  /* ── In / Out pills ── */
  .inout-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .inout-pill {
    background: var(--surface2);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .inout-pill .pill-label {
    font-family: var(--pixel);
    font-size: 1rem;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .inout-pill .pill-amount { font-family: var(--pixel); font-size: 1.4rem; }
  .pill-in .pill-label  { color: var(--green); }
  .pill-in .pill-amount { color: var(--green); }
  .pill-out .pill-label  { color: var(--red); }
  .pill-out .pill-amount { color: var(--red); }

  /* ── Transaction list ── */
  .txn-date-group { margin-bottom: 14px; }
  .txn-date-label {
    font-family: var(--pixel);
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .txn-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 6px; animation: fadeUp 0.25s ease forwards;
  }
  .txn-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .txn-icon.income  { background: var(--green-dim); }
  .txn-icon.expense { background: var(--red-dim); }
  .txn-info { flex: 1; min-width: 0; }
  .txn-cat {
    font-family: var(--pixel); font-size: 1rem;
    color: var(--muted); letter-spacing: 1px; margin-bottom: 3px;
  }
  .txn-note {
    font-family: var(--mono); font-size: 1.1rem; font-weight: 500;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .txn-amount { font-family: var(--pixel); font-size: 1.2rem; flex-shrink: 0; }
  .txn-amount.income  { color: var(--green); }
  .txn-amount.expense { color: var(--red); }

  .txn-delete {
    background: none; border: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 4px;
    flex-shrink: 0; opacity: 0.5; transition: opacity 0.2s;
  }
  .txn-delete:active { opacity: 1; color: var(--red); }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 48px 20px; }
  .empty-icon { font-size: 40px; margin-bottom: 14px; }
  .empty-text { font-family: var(--pixel); font-size: 1rem; color: var(--muted); line-height: 1.8; letter-spacing: 0.5px; }

  /* ── Add Sheet (bottom drawer) ── */
  #add-sheet { position: fixed; inset: 0; z-index: 200; display: none; }
  #add-sheet.open { display: block; }
  #sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
  #sheet-content {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%; max-width: 430px; background: var(--bg);
    border-top: 1px solid var(--border); border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  }
  #add-sheet.open #sheet-content { transform: translateX(-50%) translateY(0); }

  .sheet-handle { width: 40px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 18px; }
  .sheet-title { font-family: var(--pixel); font-size: 1.3rem; color: var(--text); margin-bottom: 18px; text-align: center; letter-spacing: 1px; }

  /* Type toggle */
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; background: var(--surface2); border-radius: 8px; padding: 6px; }
  .type-btn { padding: 12px; border: none; border-radius: 6px; font-family: var(--pixel); font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; background: transparent; color: var(--muted); transition: all 0.2s; }
  .type-btn.active-income  { background: var(--green-dim); color: var(--green); border: 1px solid rgba(57,255,20,0.3); }
  .type-btn.active-expense { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,71,87,0.3); }

  /* Amount input */
  .amount-row { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0 14px; margin-bottom: 14px; transition: border-color 0.2s; }
  .amount-row:focus-within { border-color: var(--green); }
  .amount-prefix { font-family: var(--pixel); font-size: 1.4rem; color: var(--muted); padding-right: 12px; border-right: 1px solid var(--border); margin-right: 12px; white-space: nowrap; }
  #amount-input { flex: 1; background: transparent; border: none; outline: none; font-family: var(--pixel); font-size: 2.2rem; color: var(--text); padding: 14px 0; width: 100%; }

  /* Category chips */
  .cat-label { font-family: var(--pixel); font-size: 1rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 10px; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .cat-chip { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); font-family: var(--mono); font-size: 1rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s; white-space: nowrap; }
  .cat-chip.selected { border-color: var(--green); color: var(--green); background: var(--green-dim); }
  .cat-chip:active { transform: scale(0.95); }

  /* Note input */
  #note-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; color: var(--text); font-family: var(--mono); font-size: 1.1rem; font-weight: 500; outline: none; margin-bottom: 20px; transition: border-color 0.2s; }
  #note-input:focus { border-color: var(--green); }
  #note-input::placeholder { color: var(--muted); }

  /* Save button */
  .save-btn { width: 100%; padding: 18px; border: none; border-radius: 8px; font-family: var(--pixel); font-size: 1.3rem; letter-spacing: 1px; cursor: pointer; transition: all 0.15s; }
  .save-btn.income-mode  { background: var(--green); color: #0a0a0f; box-shadow: 0 0 16px rgba(57,255,20,0.4); }
  .save-btn.expense-mode { background: var(--red);   color: #fff;    box-shadow: 0 0 16px rgba(255,71,87,0.4); }
  .save-btn:active { transform: scale(0.97); }

  /* ── Summary screen ── */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-nav-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 42px; height: 42px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s; }
  .month-nav-btn:active { border-color: var(--green); }
  .month-name { font-family: var(--pixel); font-size: 1.2rem; color: var(--text); letter-spacing: 1px; }

  .cat-breakdown { margin-top: 4px; }
  .cat-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .cat-row:last-child { border-bottom: none; }
  .cat-row-icon { font-size: 20px; width: 32px; text-align: center; }
  .cat-row-name { flex: 1; font-family: var(--mono); font-size: 1.1rem; font-weight: 600;}
  .cat-row-bar-wrap { flex: 2; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .cat-row-bar { height: 100%; background: var(--red); border-radius: 3px; transition: width 0.5s ease; }
  .cat-row-amount { font-family: var(--pixel); font-size: 1rem; color: var(--red); white-space: nowrap; }

  /* ── Streak screen ── */
  .streak-hero { text-align: center; padding: 28px 16px; }
  .streak-fire { font-size: 64px; margin-bottom: 10px; }
  .streak-count { font-family: var(--pixel); font-size: 4.5rem; color: var(--gold); text-shadow: 0 0 24px rgba(212,168,83,0.5); margin-bottom: 10px; }
  .streak-sub { font-family: var(--pixel); font-size: 1rem; color: var(--muted); letter-spacing: 1px; line-height: 1.8; }

  .week-dots { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
  .week-dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .week-dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; }
  .week-dot.done { border-color: var(--gold); background: var(--gold-dim); box-shadow: 0 0 8px rgba(212,168,83,0.3); }
  .week-dot.today { border-color: var(--green); }
  .week-dot-label { font-family: var(--pixel); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.5px; }

  .milestone-row { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 10px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); }
  .milestone-icon { font-size: 26px; }
  .milestone-info { flex: 1; }
  .milestone-name { font-family: var(--pixel); font-size: 1rem; color: var(--text); margin-bottom: 6px; }
  .milestone-desc { font-family: var(--mono); font-size: 1rem; font-weight: 500; color: var(--muted); }
  .milestone-status { font-family: var(--pixel); font-size: 1rem; }
  .milestone-status.done { color: var(--gold); }
  .milestone-status.locked { color: var(--muted); }

  /* ── Animations ── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to  { opacity: 1; transform: translateY(0); } }

  /* ── Toast ── */
  #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(6, 6, 10, 0.95); border: 1px solid var(--green); color: var(--green); font-family: var(--pixel); font-size: 1rem; padding: 12px 20px; border-radius: 24px; letter-spacing: 1px; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 300; white-space: nowrap; box-shadow: 0 0 16px rgba(57,255,20,0.2); backdrop-filter: blur(8px); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="app">
  
  <a href="index.html" class="nav-back">← HUB MENU</a>

  <div id="screen-home" class="screen active">
    <div class="page-header">
      <div class="page-title">💰 COINQUEST</div>
      <div class="streak-badge" id="header-streak">🔥 <span id="streak-count-home">0</span> DAY</div>
    </div>

    <div class="card card-accent-green">
      <div class="balance-hero">
        <div class="balance-label">NET BALANCE · <span id="home-month-label"></span></div>
        <div class="balance-amount" id="home-balance">Rs 0</div>
      </div>
      <div class="inout-row">
        <div class="inout-pill pill-in">
          <div class="pill-label">▲ INCOME</div>
          <div class="pill-amount" id="home-income">Rs 0</div>
        </div>
        <div class="inout-pill pill-out">
          <div class="pill-label">▼ EXPENSES</div>
          <div class="pill-amount" id="home-expense">Rs 0</div>
        </div>
      </div>
    </div>

    <div style="font-family:var(--pixel);font-size:1rem;color:var(--muted);letter-spacing:2px;margin-bottom:12px;">▸ RECENT</div>
    <div id="home-txn-list"></div>
  </div>

  <div id="screen-log" class="screen">
    <div class="page-header">
      <div class="page-title">📋 LOG</div>
    </div>
    <div id="log-txn-list"></div>
  </div>

  <div id="screen-summary" class="screen">
    <div class="page-header">
      <div class="page-title">📊 SUMMARY</div>
    </div>

    <div class="month-nav">
      <button class="month-nav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-name" id="summary-month-name">MAY 2026</div>
      <button class="month-nav-btn" onclick="changeMonth(1)">▶</button>
    </div>

    <div class="card card-accent-green">
      <div class="balance-label" style="font-family:var(--pixel);font-size:1rem;color:var(--muted);letter-spacing:2px;margin-bottom:8px;">NET BALANCE</div>
      <div class="balance-amount" id="summary-balance">Rs 0</div>
    </div>

    <div class="inout-row">
      <div class="inout-pill pill-in">
        <div class="pill-label">▲ INCOME</div>
        <div class="pill-amount" id="summary-income">Rs 0</div>
      </div>
      <div class="inout-pill pill-out">
        <div class="pill-label">▼ EXPENSES</div>
        <div class="pill-amount" id="summary-expense">Rs 0</div>
      </div>
    </div>

    <div class="card" id="savings-rate-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-family:var(--pixel);font-size:1rem;color:var(--muted);letter-spacing:1px;">SAVINGS RATE</div>
        <div style="font-family:var(--pixel);font-size:1.2rem;color:var(--green);" id="savings-rate-pct">0%</div>
      </div>
      <div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden;">
        <div id="savings-rate-bar" style="height:100%;background:var(--green);border-radius:5px;transition:width 0.5s ease;width:0%;box-shadow:0 0 6px rgba(57,255,20,0.4);"></div>
      </div>
    </div>

    <div class="card">
      <div style="font-family:var(--pixel);font-size:1rem;color:var(--muted);letter-spacing:2px;margin-bottom:16px;">▸ BY CATEGORY</div>
      <div class="cat-breakdown" id="cat-breakdown"></div>
    </div>
  </div>

  <div id="screen-streak" class="screen">
    <div class="page-header">
      <div class="page-title">🔥 STREAK</div>
    </div>

    <div class="card card-accent-green">
      <div class="streak-hero">
        <div class="streak-fire">🔥</div>
        <div class="streak-count" id="streak-big">0</div>
        <div class="streak-sub">DAY STREAK<br>LOG DAILY TO KEEP IT ALIVE</div>
      </div>

      <div style="font-family:var(--pixel);font-size:1rem;color:var(--muted);letter-spacing:2px;margin-bottom:16px;text-align:center;">THIS WEEK</div>
      <div class="week-dots" id="week-dots"></div>
    </div>

    <div style="font-family:var(--pixel);font-size:1rem;color:var(--muted);letter-spacing:2px;margin-bottom:12px;">▸ MILESTONES</div>
    <div id="milestones-list"></div>
  </div>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-screen="home" onclick="switchScreen('home',this)">
      <span class="icon">🏠</span>HOME
    </button>
    <button class="nav-btn" data-screen="log" onclick="switchScreen('log',this)">
      <span class="icon">📋</span>LOG
    </button>
    <button class="nav-btn add-btn" onclick="openSheet()">
      <div class="icon-wrap">➕</div>
    </button>
    <button class="nav-btn" data-screen="summary" onclick="switchScreen('summary',this)">
      <span class="icon">📊</span>STATS
    </button>
    <button class="nav-btn" data-screen="streak" onclick="switchScreen('streak',this)">
      <span class="icon">🔥</span>STREAK
    </button>
  </nav>
</div>

<div id="add-sheet">
  <div id="sheet-backdrop" onclick="closeSheet()"></div>
  <div id="sheet-content">
    <div class="sheet-handle"></div>
    <div class="sheet-title">LOG TRANSACTION</div>

    <div class="type-toggle">
      <button class="type-btn active-expense" id="btn-expense" onclick="setType('expense')">▼ EXPENSE</button>
      <button class="type-btn" id="btn-income"  onclick="setType('income')">▲ INCOME</button>
    </div>

    <div class="amount-row">
      <div class="amount-prefix">RS</div>
      <input type="number" id="amount-input" placeholder="0" inputmode="decimal">
    </div>

    <div class="cat-label">CATEGORY</div>
    <div class="cat-chips" id="cat-chips"></div>

    <input type="text" id="note-input" placeholder="Note (optional)..." maxlength="60">

    <button class="save-btn expense-mode" id="save-btn" onclick="saveTransaction()">▶ SAVE EXPENSE</button>
  </div>
</div>

<div id="toast"></div>

<script>
const CATEGORIES = {
  expense: [
    { id:'food',    icon:'🍛', name:'Food' },
    { id:'trans',   icon:'🚌', name:'Transport' },
    { id:'bills',   icon:'💡', name:'Bills' },
    { id:'enter',   icon:'🎮', name:'Fun' },
    { id:'edu',     icon:'📚', name:'Education' },
    { id:'health',  icon:'💊', name:'Health' },
    { id:'shop',    icon:'🛍️', name:'Shopping' },
    { id:'other',   icon:'📦', name:'Other' },
  ],
  income: [
    { id:'salary',  icon:'💰', name:'Salary' },
    { id:'free',    icon:'💻', name:'Freelance' },
    { id:'gift',    icon:'🎁', name:'Gift' },
    { id:'other',   icon:'📦', name:'Other' },
  ]
};

const MILESTONES = [
  { days:3,  icon:'🌱', name:'SEEDLING',    desc:'Log 3 days in a row' },
  { days:7,  icon:'🔥', name:'ON FIRE',     desc:'7-day streak!' },
  { days:14, icon:'⚔️', name:'WARRIOR',    desc:'14 days of tracking' },
  { days:30, icon:'👑', name:'MASTER',      desc:'30-day streak — you win!' },
];

let currentType     = 'expense';
let selectedCat     = null;
let summaryDate     = new Date();
let transactions    = [];
let streak          = 0;
let lastLogDate     = null;

function save() {
  localStorage.setItem('cq_txns',       JSON.stringify(transactions));
  localStorage.setItem('cq_streak',     streak);
  localStorage.setItem('cq_lastlog',    lastLogDate || '');
}

function load() {
  transactions = JSON.parse(localStorage.getItem('cq_txns') || '[]');
  streak       = parseInt(localStorage.getItem('cq_streak') || '0');
  lastLogDate  = localStorage.getItem('cq_lastlog') || null;
}

function todayStr() { return new Date().toISOString().slice(0,10); }

function updateStreak(logDate) {
  const today = todayStr();
  if (lastLogDate === today) return; 

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().slice(0,10);

  if (lastLogDate === yStr) { streak++; } 
  else if (lastLogDate !== today) { streak = 1; }
  lastLogDate = today;
  save();
}

function fmtAmt(n) { return 'Rs ' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0}); }

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const today = todayStr();
  const yest  = new Date(); yest.setDate(yest.getDate()-1);
  const yesterdayStr = yest.toISOString().slice(0,10);
  if (dateStr === today) return 'TODAY';
  if (dateStr === yesterdayStr) return 'YESTERDAY';
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
}

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function switchScreen(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  renderScreen(name);
}

function renderScreen(name) {
  if (name === 'home')    renderHome();
  if (name === 'log')     renderLog();
  if (name === 'summary') renderSummary();
  if (name === 'streak')  renderStreak();
}

function renderHome() {
  const now = new Date();
  const m = now.getMonth(), y = now.getFullYear();
  document.getElementById('home-month-label').textContent = MONTHS[m] + ' ' + y;

  const monthTxns = transactions.filter(t => {
    const d = new Date(t.date + 'T00:00:00');
    return d.getMonth() === m && d.getFullYear() === y;
  });

  const income  = monthTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = monthTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;

  const balEl = document.getElementById('home-balance');
  balEl.textContent = fmtAmt(balance);
  balEl.className = 'balance-amount' + (balance < 0 ? ' negative' : '');

  document.getElementById('home-income').textContent  = fmtAmt(income);
  document.getElementById('home-expense').textContent = fmtAmt(expense);
  document.getElementById('streak-count-home').textContent = streak;

  const recent = [...transactions].slice(0,5);
  const list = document.getElementById('home-txn-list');
  if (!recent.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">💸</div>
      <div class="empty-text">NO TRANSACTIONS YET<br>HIT ➕ TO LOG YOUR FIRST ONE</div>
    </div>`;
    return;
  }
  list.innerHTML = recent.map(t => txnHTML(t)).join('');
}

function renderLog() {
  const list = document.getElementById('log-txn-list');
  if (!transactions.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-text">YOUR LOG IS EMPTY<br>START TRACKING!</div>
    </div>`;
    return;
  }

  const groups = {};
  transactions.forEach(t => {
    if (!groups[t.date]) groups[t.date] = [];
    groups[t.date].push(t);
  });

  list.innerHTML = Object.keys(groups).map(date => `
    <div class="txn-date-group">
      <div class="txn-date-label">${fmtDate(date)}</div>
      ${groups[date].map(t => txnHTML(t)).join('')}
    </div>
  `).join('');
}

function txnHTML(t) {
  const catList = [...CATEGORIES.expense, ...CATEGORIES.income];
  const cat = catList.find(c => c.id === t.catId) || { icon:'📦', name:'Other' };
  return `
    <div class="txn-item">
      <div class="txn-icon ${t.type}">${cat.icon}</div>
      <div class="txn-info">
        <div class="txn-cat">${cat.name.toUpperCase()}</div>
        <div class="txn-note">${t.note || (t.type === 'income' ? 'Income' : 'Expense')}</div>
      </div>
      <div class="txn-amount ${t.type}">${t.type==='income'?'+':'-'}${fmtAmt(t.amount)}</div>
      <button class="txn-delete" onclick="deleteTransaction('${t.id}')">✕</button>
    </div>
  `;
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  save();
  renderHome();
  renderLog();
  showToast('DELETED');
}

let summaryMonth = new Date().getMonth();
let summaryYear  = new Date().getFullYear();

function changeMonth(dir) {
  summaryMonth += dir;
  if (summaryMonth < 0)  { summaryMonth = 11; summaryYear--; }
  if (summaryMonth > 11) { summaryMonth = 0;  summaryYear++; }
  renderSummary();
}

function renderSummary() {
  document.getElementById('summary-month-name').textContent = MONTHS[summaryMonth] + ' ' + summaryYear;

  const monthTxns = transactions.filter(t => {
    const d = new Date(t.date + 'T00:00:00');
    return d.getMonth() === summaryMonth && d.getFullYear() === summaryYear;
  });

  const income  = monthTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = monthTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  const rate    = income > 0 ? Math.max(0, Math.round(((income-expense)/income)*100)) : 0;

  const balEl = document.getElementById('summary-balance');
  balEl.textContent = fmtAmt(balance);
  balEl.className = 'balance-amount' + (balance < 0 ? ' negative' : '');

  document.getElementById('summary-income').textContent  = fmtAmt(income);
  document.getElementById('summary-expense').textContent = fmtAmt(expense);
  document.getElementById('savings-rate-pct').textContent = rate + '%';
  document.getElementById('savings-rate-bar').style.width = Math.min(rate, 100) + '%';

  const catTotals = {};
  monthTxns.filter(t=>t.type==='expense').forEach(t => {
    catTotals[t.catId] = (catTotals[t.catId] || 0) + t.amount;
  });

  const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const maxAmt = sorted[0]?.[1] || 1;

  const bd = document.getElementById('cat-breakdown');
  if (!sorted.length) {
    bd.innerHTML = `<div style="font-family:var(--mono);font-size:1.1rem;font-weight:500;color:var(--muted);text-align:center;padding:16px;">No expenses this month</div>`;
    return;
  }

  bd.innerHTML = sorted.map(([catId, amt]) => {
    const cat = CATEGORIES.expense.find(c=>c.id===catId) || {icon:'📦', name:'Other'};
    const pct = Math.round((amt/maxAmt)*100);
    return `
      <div class="cat-row">
        <div class="cat-row-icon">${cat.icon}</div>
        <div class="cat-row-name">${cat.name}</div>
        <div class="cat-row-bar-wrap"><div class="cat-row-bar" style="width:${pct}%"></div></div>
        <div class="cat-row-amount">${fmtAmt(amt)}</div>
      </div>
    `;
  }).join('');
}

function renderStreak() {
  document.getElementById('streak-big').textContent = streak;

  const dots = document.getElementById('week-dots');
  const today = new Date();
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const loggedDates = new Set(transactions.map(t => t.date));

  let weekHTML = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0,10);
    const isToday  = i === 0;
    const logged   = loggedDates.has(ds);
    const cls = logged ? 'done' : (isToday ? 'today' : '');
    weekHTML += `
      <div class="week-dot-wrap">
        <div class="week-dot ${cls}">${logged ? '✓' : (isToday ? '·' : '')}</div>
        <div class="week-dot-label">${days[d.getDay()]}</div>
      </div>
    `;
  }
  dots.innerHTML = weekHTML;

  const ml = document.getElementById('milestones-list');
  ml.innerHTML = MILESTONES.map(m => {
    const done = streak >= m.days;
    return `
      <div class="milestone-row">
        <div class="milestone-icon">${m.icon}</div>
        <div class="milestone-info">
          <div class="milestone-name">${m.name}</div>
          <div class="milestone-desc">${m.desc}</div>
        </div>
        <div class="milestone-status ${done?'done':'locked'}">${done?'✓ DONE':'🔒 '+m.days+'D'}</div>
      </div>
    `;
  }).join('');
}

function openSheet() {
  document.getElementById('add-sheet').classList.add('open');
  buildCatChips();
  setTimeout(() => document.getElementById('amount-input').focus(), 350);
}

function closeSheet() {
  document.getElementById('add-sheet').classList.remove('open');
  document.getElementById('amount-input').value = '';
  document.getElementById('note-input').value   = '';
  selectedCat = null;
  setType('expense');
}

function setType(type) {
  currentType = type;
  selectedCat = null;
  document.getElementById('btn-expense').className = 'type-btn' + (type==='expense'?' active-expense':'');
  document.getElementById('btn-income').className  = 'type-btn' + (type==='income'?' active-income':'');
  document.getElementById('save-btn').className    = 'save-btn ' + type + '-mode';
  document.getElementById('save-btn').textContent  = '▶ SAVE ' + type.toUpperCase();
  buildCatChips();
}

function buildCatChips() {
  const chips = document.getElementById('cat-chips');
  chips.innerHTML = CATEGORIES[currentType].map(c => `
    <div class="cat-chip ${selectedCat===c.id?'selected':''}" onclick="selectCat('${c.id}')">
      ${c.icon} ${c.name}
    </div>
  `).join('');
}

function selectCat(id) {
  selectedCat = id;
  buildCatChips();
}

function saveTransaction() {
  const amt = parseFloat(document.getElementById('amount-input').value);
  if (!amt || amt <= 0) { shakeAmount(); return; }

  const note  = document.getElementById('note-input').value.trim();
  const catId = selectedCat || (currentType === 'income' ? 'other' : 'other');

  const txn = {
    id:     Date.now().toString(),
    type:   currentType,
    amount: amt,
    catId:  catId,
    note:   note,
    date:   todayStr(),
  };

  transactions.unshift(txn);
  updateStreak(todayStr());
  save();
  closeSheet();

  const active = document.querySelector('.screen.active');
  if (active) renderScreen(active.id.replace('screen-',''));

  showToast(currentType === 'income' ? '✓ INCOME LOGGED!' : '✓ EXPENSE LOGGED!');
}

function shakeAmount() {
  const el = document.querySelector('.amount-row');
  el.style.borderColor = 'var(--red)';
  el.style.animation = 'none';
  el.offsetHeight;
  setTimeout(() => { el.style.borderColor = ''; }, 600);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

load();
renderHome();

(function checkStreakReset() {
  if (!lastLogDate) return;
  const today = todayStr();
  if (lastLogDate === today) return;
  const last = new Date(lastLogDate + 'T00:00:00');
  const diff = Math.floor((new Date(today) - last) / 86400000);
  if (diff > 1) { streak = 0; save(); }
})();
</script>
